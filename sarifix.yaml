# sarifix config: which scanners run over this repo and which of their
# findings become fix batches. See https://rossedman.io/sarifix/configuration/.
# The sarifix workflow (.github/workflows/sarifix.yml) installs each scanner
# at the version the action pins.
version: 1

scanners:
  # Same linters and settings as `make lint`, via .golangci.yml.
  - name: golangci-lint
    command: ["golangci-lint", "run", "--output.sarif.path={out}", "./..."]
    workdir: "{dir}"
    scope: dir
    timeout: 10m

  # Known vulnerabilities in go.mod and requirements-docs.txt, plus
  # misconfigurations and secrets. The fixture repo's Terraform is insecure
  # on purpose, so testdata is skipped.
  - name: trivy
    match: ["Trivy"]
    command: ["trivy", "fs", "--scanners", "vuln,misconfig,secret", "--skip-dirs", "testdata", "--format", "sarif", "-o", "{out}", "--quiet", "{dir}"]
    scope: dir

  # Go security rules from the Semgrep registry. Its SARIF names the tool
  # "Semgrep OSS". math-random-used flags the retry jitter, and sarifix
  # doesn't honor nosemgrep suppressions; gosec's G404 in golangci-lint
  # covers it with a per-line //nolint instead.
  - name: semgrep
    match: ["Semgrep OSS"]
    command: ["semgrep", "scan", "--config", "p/golang", "--exclude-rule", "go.lang.security.audit.crypto.math_random.math-random-used", "--metrics=off", "--sarif", "--output", "{out}", "--quiet", "{dir}"]
    scope: dir

rules:
  # Lint and Semgrep findings, and vulnerable dependencies, are batched for
  # fixing. Trivy's secret and misconfiguration findings are only reported
  # to code scanning: a leaked secret needs rotating, not just deleting.
  allow: ["golangci-lint/*", "semgrep/*", "trivy/CVE-*", "trivy/GHSA-*"]
  min_level: warning

paths:
  # The fixture's counts are hand-checked and tests depend on them, and the
  # command reference is generated by `make docs`.
  deny:
    - ".github/workflows/**"
    - "testdata/**"
    - "docs/reference/commands/**"

verify:
  commands: [["make", "lint"], ["make", "cover"], ["make", "doccheck"]]
  require_no_new_findings: true

agent:
  extra_instructions: CLAUDE.md
