# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tfmetrics

builds:
  - id: tfmetrics
    main: .
    binary: tfmetrics
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/rossedman/tfmetrics/cmd.version={{.Version}} -X github.com/rossedman/tfmetrics/cmd.commit={{.Commit}} -X github.com/rossedman/tfmetrics/cmd.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^(test|ci|chore|style|build)(\([[:word:]]+\))??!?:'
      - "^Merge "

release:
  github:
    owner: rossedman
    name: tfmetrics
