# The tfmetrics site: the landing page (overrides/home.html) and every page in
# docs/. Built and published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally: make docs-serve. Strict build: make docs-build.
site_name: tfmetrics
site_description: Org-wide Terraform metrics from static parsing
site_url: https://rossedman.io/tfmetrics/
repo_url: https://github.com/rossedman/tfmetrics
repo_name: rossedman/tfmetrics
edit_uri: edit/main/docs/

# Strict builds (CI) fail on broken links and #anchors between pages.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  /assets/src/
  /assets/render.sh

hooks:
  - hooks/docs.py

nav:
  - Home: index.md
  - Get started:
      - Install and first run: getting-started.md
      - Configuration: configuration.md
  - Guides:
      - How it works: how-it-works.md
      - Nightly org scan: guides/nightly-org-scan.md
      - PR check: guides/pr-check.md
      - Dashboards and trends: guides/dashboards.md
  - Sinks:
      - Overview: sinks/index.md
      - Prometheus: sinks/openmetrics.md
      - OpenTelemetry: sinks/otlp.md
      - Parquet: sinks/parquet.md
      - CSV: sinks/csv.md
      - JSON: sinks/json.md
      - Markdown: sinks/markdown.md
  - Reference:
      - Metrics catalog: reference/metrics.md
      - Facts file: reference/facts.md
      - Commands:
          - tfmetrics: reference/commands/tfmetrics.md
          - tfmetrics scan: reference/commands/tfmetrics_scan.md
          - tfmetrics org: reference/commands/tfmetrics_org.md
          - tfmetrics aggregate: reference/commands/tfmetrics_aggregate.md
          - tfmetrics explain: reference/commands/tfmetrics_explain.md
          - tfmetrics version: reference/commands/tfmetrics_version.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Releases: https://github.com/rossedman/tfmetrics/releases

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/favicon.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/landing.js
  - assets/site/docs.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/tfmetrics
  generator: false
