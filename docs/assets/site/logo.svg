<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- tfmetrics: three Terraform modules stacked as a rising bar chart (the metrics measured
       across an org), the tallest with a lit port on top. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f9fd"/><stop offset="1" stop-color="#8be8f6"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52dcee"/><stop offset="1" stop-color="#1fb1c7"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e9eb5"/><stop offset="1" stop-color="#0c6479"/></linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4f8da"/><stop offset="1" stop-color="#52d38a"/></linearGradient>
  </defs>
  <polygon points="104.6,130.2 137.2,149.0 137.2,73.7 104.6,54.8" fill="url(#left)"/>
  <polygon points="137.2,149.0 169.8,130.2 169.8,54.8 137.2,73.7" fill="url(#right)"/>
  <polygon points="104.6,54.8 137.2,73.7 169.8,54.8 137.2,36.0" fill="url(#top)"/>
  <polygon points="120.2,54.8 137.2,64.6 154.2,54.8 137.2,45.0" fill="url(#lit)"/>
  <polygon points="67.4,151.7 100.0,170.5 100.0,120.8 67.4,101.9" fill="url(#left)"/>
  <polygon points="100.0,170.5 132.6,151.7 132.6,101.9 100.0,120.8" fill="url(#right)"/>
  <polygon points="67.4,101.9 100.0,120.8 132.6,101.9 100.0,83.1" fill="url(#top)"/>
  <polygon points="30.2,173.2 62.8,192.0 62.8,166.4 30.2,147.5" fill="url(#left)"/>
  <polygon points="62.8,192.0 95.4,173.2 95.4,147.5 62.8,166.4" fill="url(#right)"/>
  <polygon points="30.2,147.5 62.8,166.4 95.4,147.5 62.8,128.7" fill="url(#top)"/>
</svg>
